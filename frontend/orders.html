<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--
    Content-Security-Policy: this is the deployment baseline.
    PRODUCTION: replace connect-src entries with your real API origin if it is
    not same-origin, and remove the localhost entries. Everything else should
    stay as-is — the app has no CDN dependencies.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data: blob: https:;
                 font-src 'self' data:;
                 connect-src 'self' http://localhost:8080 http://127.0.0.1:8080 https://api.nim.shop https://*.nim.shop https://*.trycloudflare.com https://hub.nimiq.com https://hub.nimiq-testnet.com;
                 frame-src https://hub.nimiq.com https://hub.nimiq-testnet.com;
                 object-src 'none'; base-uri 'self'; form-action 'self';
                 upgrade-insecure-requests" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F6F9" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Track every nim.shop order live: from payment to delivery codes, plus your full purchase history." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Orders — Track your purchases</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/img/icon-64.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/img/icon-512.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
