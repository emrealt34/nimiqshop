# actions/labeler v7: label names map to changed-file matchers.
backend:
- changed-files:
  - any-glob-to-any-file:
    - backend/**
    - cli/**
go:
- changed-files:
  - any-glob-to-any-file:
    - backend/**
    - backend/go.mod
    - backend/go.sum
cli:
- changed-files:
  - any-glob-to-any-file:
    - cli/**
infra:
- changed-files:
  - any-glob-to-any-file:
    - deploy/**
    - .github/workflows/**
tooling:
- changed-files:
  - any-glob-to-any-file:
    - scripts/**
e2e:
- changed-files:
  - any-glob-to-any-file:
    - tests/e2e/**
    - src/**
    - public/**
    - playwright.config.ts
    - astro.config.mjs
    - scripts/csp-inline.mjs
    - scripts/public-url.mjs
    - scripts/proxy.mjs
i18n:
- changed-files:
  - any-glob-to-any-file:
    - src/i18n/**
frontend:
- changed-files:
  - any-glob-to-any-file:
    - src/components/**
    - src/styles/**
    - public/**
    - src/pages/**
    - astro.config.mjs
    - package.json
    - package-lock.json
react:
- changed-files:
  - any-glob-to-any-file:
    - src/components/**
css:
- changed-files:
  - any-glob-to-any-file:
    - src/styles/**
astro:
- changed-files:
  - any-glob-to-any-file:
    - src/pages/**
    - astro.config.mjs
deps:
- changed-files:
  - any-glob-to-any-file:
    - package.json
    - package-lock.json
    - backend/go.mod
    - backend/go.sum
    - .github/dependabot.yml
ci:
- changed-files:
  - any-glob-to-any-file:
    - .github/workflows/**
    - .github/dependabot.yml
meta:
- changed-files:
  - any-glob-to-any-file:
    - LICENSE
docs:
- changed-files:
  - any-glob-to-any-file:
    - README.md
    - SECURITY.md
security:
- changed-files:
  - any-glob-to-any-file:
    - SECURITY.md
    - .gitleaksignore
