version: 2
# This repository uses main only. Version-update PRs are disabled so
# Dependabot cannot recreate branches. Vulnerability alerts and CI security
# scanners stay enabled; dependency fixes are applied and tested on main.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    ignore:
      # eslint 10.x pins minimatch ^3.1.2 / ^9.0.x; bumping minimatch to 11.x
      # breaks npm peer resolution and causes Dependabot security-update check
      # runs to fail on main, aborting Railway Wait-for-CI deploys.
      - dependency-name: minimatch
        versions:
          - '>= 11.0.0'
    groups:
      # Astro + its integrations move together; splitting them produces
      # pull requests that cannot pass the build on their own.
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      tooling:
        patterns:
          - eslint
          - typescript
          - oxlint
          - '@eslint/*'
          - '@microsoft/*'
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      # The vendored x/crypto copy is deliberately absent from go.mod, so the
      # module graph here is small enough to review dependency by dependency.
      fasthttp:
        patterns:
          - 'github.com/valyala/fasthttp'
          - 'github.com/fasthttp/router'
          - 'github.com/klauspost/compress'
    labels:
      - dependencies
      - go
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      # Action pins are 40-character SHAs with a `# vX.Y.Z` comment; a group
      # keeps the pin/comment pairs reviewable in one diff.
      actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci'
