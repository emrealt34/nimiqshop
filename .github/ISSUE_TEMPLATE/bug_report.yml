name: Bug report
description: Something in the shop behaves differently than it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security issues here.** Secrets, payments, wallet
        handling and auth bypasses go through the private advisory flow in
        `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
      placeholder: |
        Expected: the quote shows the NIM amount
        Actual: the total stays 0 after picking a gift card
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag (for example v2.0.0) or the commit you are running.
      placeholder: v2.0.0
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Shop / product page
        - Cart
        - Checkout
        - Orders / tracking
        - Cashback
        - Tree planting
        - Admin panel
        - Install / nimshop CLI
        - API only
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, phone or desktop, language, and whether the issue also happens in TEST_MODE.
      placeholder: Firefox 141 on Ubuntu 24.04, desktop, English
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or console output
      description: "From `nimshop logs`, or the browser console. Redact keys, order ids and wallet addresses."
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed no personal data — the log excerpt above is redacted
          required: true
