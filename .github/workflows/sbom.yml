name: SBOM

# Produce a CycloneDX software bill of materials for auditing and release
# review. This job has no write token and does not publish source contents.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "11 4 1 * *"
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          # Upload it ourselves: the action's own release-asset upload races
          # release.yml when both fire on the same tag.
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nimshop-sbom
          path: sbom.cdx.json
          retention-days: 90
