name: Semgrep

# Community rule packs for Go, TypeScript/JavaScript, React, GitHub Actions
# and secrets. Runs the pinned semgrep CLI directly (no Semgrep account,
# telemetry off), uploads SARIF to the Security tab and fails on any
# finding. The two deliberate exceptions in the code base carry an inline
# `nosemgrep: <rule>` with the reason on the same line.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: "26 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (community rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      actions: read # codeql-action reads workflow metadata for the upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install semgrep (pinned, hash-verified)
        run: pip install --require-hashes --no-deps -r .github/semgrep-requirements.txt
      - name: Scan
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config p/golang --config p/typescript --config p/javascript \
            --config p/react --config p/secrets --config p/github-actions \
            --metrics=off --error \
            --exclude node_modules --exclude dist --exclude public/vendor \
            --exclude backend/internal/xcrypto \
            --sarif --output semgrep.sarif .
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
