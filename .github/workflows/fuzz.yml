name: Go fuzzing

# Fuzz parsers on trusted code only. Pull requests keep the fast CI path
# predictable; this job runs against main on a schedule or on demand.
on:
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Nimiq address parser
            package: ./internal/nimiq
            target: FuzzValidateAddress
          - name: Phone normalizer
            package: ./internal/phone
            target: FuzzNormalize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Fuzz for 45 seconds
        working-directory: backend
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
        run: go test -run='^$' -fuzz="$TARGET" -fuzztime=45s "$PACKAGE"
      - name: Upload new fuzz corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: backend/**/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 14
