name: Performance and accessibility

# Lighthouse runs on main and once a week, not on every pull request: the
# numbers move with runner hardware, and a score gate that flickers teaches
# everyone to ignore it. The measured baseline (5 crawled pages, desktop
# preset) clears every budget, so accessibility is a hard `error` in
# .lighthouserc.json and a drop turns the build red. Performance,
# best-practices, SEO and the byte budget stay `warn`: they move with runner
# hardware and third-party scripts, so they report instead of blocking. The
# bundle budget that actually matters for a shop lives in benchmarks.yml.
on:
  push:
    branches: [main]
  schedule:
    - cron: "19 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Scores in the run summary
        if: always()
        # A small script rather than an inline `node -e`: it stays lintable and
        # keeps the YAML readable.
        run: node scripts/lighthouse-summary.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          # The report directory is hidden, and upload-artifact v4+ skips
          # hidden files unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
