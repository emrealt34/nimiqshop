name: DevSkim

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: "38 22 * * 2"

concurrency:
  group: devskim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # codeql-action reads workflow metadata for the upload
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Findings are fixed in code, never silently muted. The glob list below
      # only skips files where the rules are structurally inapplicable: test
      # fixtures that talk to loopback, the generated supplier catalog (its
      # Spanish product names contain strings like "to-do"/"bono"), and local
      # dev tooling.
      #
      # DS172411 (ReviewSettimeoutForUntrustedData) is excluded as a rule: it
      # fires on every closure-based setTimeout, and all 14 call sites in this
      # repo were read during review — the callback is always a function
      # literal, never a string, and no untrusted data reaches it, so the rule
      # cannot be satisfied in code. The per-site notes stay in the source.
      # The exclusion is visible here on purpose: if the rule later flags a
      # string-built timeout anywhere, it will be missed by this scanner and
      # that trade-off is accepted, not hidden.
      #
      # Everything else, including SuspiciousComment and the loopback/http
      # rules the globs used to skip, keeps failing the job. Reproduce locally:
      #   devskim analyze --source-code . --ignore-globs "<same list>" \
      #     --exclude-rules DS172411
      - uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1.0.16
        with:
          ignore-globs: "**/node_modules/**,**/dist/**,**/*.min.js,**/package-lock.json,**/.git/**,**/test-results/**,**/playwright-report/**,**/blob-report/**,**/.astro/**,**/*_test.go,**/testdata/**,**/public/data/**,**/devtools/**,**/.lighthouserc.json"
          exclude-rules: "DS172411"
      # No explicit `category`: GitHub then keys the analysis set by
      # "<workflow file>:<job id>", which is what the original alerts were
      # filed under. Changing the category (or renaming this job) strands the
      # old set — its alerts stay open until an upload under the old category
      # marks them fixed.
      - name: Preserve scanner report independently of GitHub license
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.job }}-security-report
          path: devskim-results.sarif
          if-no-files-found: ignore
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ always() && (!github.event.repository.private || vars.ENABLE_PRIVATE_CODE_SCANNING == 'true') }}
        with:
          sarif_file: devskim-results.sarif
