name: DevSkim

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: "38 22 * * 2"

concurrency:
  group: devskim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # codeql-action reads workflow metadata for the upload
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Findings are fixed in code, never dismissed: the handful of rules that
      # cannot be satisfied (loopback URLs in dev tooling, the ORIGIN literal
      # in playwright.config.ts) carry an inline `DevSkim: ignore` with the
      # reason next to the line. Reproduce locally with the DevSkim CLI:
      #   devskim analyze --source-code . --ignore-globs "<same list>"
      - uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1.0.16
        with:
          ignore-globs: "**/node_modules/**,**/dist/**,**/*.min.js,**/package-lock.json,**/.git/**,**/test-results/**,**/playwright-report/**,**/blob-report/**,**/.astro/**"
      # No explicit `category`: GitHub then keys the analysis set by
      # "<workflow file>:<job id>", which is what the original alerts were
      # filed under. Changing the category (or renaming this job) strands the
      # old set — its alerts stay open until an upload under the old category
      # marks them fixed.
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: devskim-results.sarif
