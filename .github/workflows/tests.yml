name: Tests

# The LONG suites (Playwright end-to-end). They are intentionally kept off
# the push path — the fast gate is ci.yml. This workflow runs:
#   • every weekday at 00:00 UTC (03:00 Istanbul) against main
#   • on demand (Actions → Tests → Run workflow, optionally a single suite)
#   • on pull requests that carry the `e2e` label
#
#   build       — production dist (GitHub Pages layout) shared by every job
#   responsive  — deep responsive scan, desktop / tablet / phone, 4 shards each
#   functional  — routing, links, crash, resilience, header, impact card,
#                 PNG, identicons, i18n UI — chromium, 4 shards
#   engines     — @smoke subset on Firefox, WebKit, mobile Safari
#   report      — merged HTML report + screenshot gallery (artifacts)
#
# Static checks (types, i18n, API contract, lint) moved to ci.yml.

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suites to run"
        type: choice
        default: all
        options: [all, responsive, functional, engines]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # Explore step (route-crawl per language) only in English; every language
  # still gets the audit + screenshot at every viewport. See responsive.spec.ts.
  SCAN_EXPLORE_LANGS: en

jobs:
  build:
    name: Build (GitHub Pages layout)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:e2e:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1

  responsive:
    name: Responsive · ${{ matrix.device }} ${{ matrix.shard }}/4
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'responsive'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, tablet, phone]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - run: npx playwright test --project="$DEVICE" --shard="$SHARD"/4
        env:
          DEVICE: ${{ matrix.device }}
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shots-${{ matrix.device }}-${{ matrix.shard }}
          path: screenshots
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blob-responsive-${{ matrix.device }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 3
          if-no-files-found: ignore

  functional:
    name: Functional · chromium ${{ matrix.shard }}/4
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'functional'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - run: npx playwright test --project=chromium --shard="$SHARD"/4
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blob-functional-${{ matrix.shard }}
          path: blob-report
          retention-days: 3
          if-no-files-found: ignore

  engines:
    name: Smoke · ${{ matrix.project }}
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'engines'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-safari
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - run: npx playwright test --project="$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blob-engines-${{ matrix.project }}
          path: blob-report
          retention-days: 3
          if-no-files-found: ignore

  report:
    name: Report · HTML + screenshot gallery
    needs: [build, responsive, functional, engines]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # a partial (workflow_dispatch) run may have no screenshots
        with:
          pattern: shots-*
          path: screenshots
          merge-multiple: true
      - run: node scripts/e2e-gallery.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-screenshots
          path: screenshots
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore
      - name: Fail if any suite failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESPONSIVE: ${{ needs.responsive.result }}
          FUNCTIONAL: ${{ needs.functional.result }}
          ENGINES: ${{ needs.engines.result }}
        run: |
          echo "responsive=$RESPONSIVE functional=$FUNCTIONAL engines=$ENGINES"
          exit 1
