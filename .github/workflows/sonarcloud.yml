name: SonarCloud analysis

# Needs a SONAR_TOKEN repository secret (SonarCloud → My Account → Security)
# and the project imported at https://sonarcloud.io under organization
# "emrealt34". Until the secret exists the job exits early instead of failing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Analysis:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # PR decoration metadata (SonarCloud reads the PR number/branch)
    steps:
      - name: Check for SONAR_TOKEN
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::SONAR_TOKEN secret not set — skipping SonarCloud analysis"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0 # blame / new-code detection needs history
          persist-credentials: false
      - name: Analyze with SonarCloud
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=emrealt34_nimiqshop
            -Dsonar.organization=emrealt34
            -Dsonar.sources=src,scripts,backend,integrations
            -Dsonar.tests=tests
            -Dsonar.exclusions=**/node_modules/**,dist/**,public/**
