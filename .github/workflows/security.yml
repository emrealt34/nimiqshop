name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    permissions:
      contents: read
      pull-requests: read # Gitleaks reads the PR commit list in private repositories.
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  go-vuln:
    name: Go govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Scan (blocking — a reachable vulnerable call fails the job)
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  xcrypto-drift:
    name: Vendored x/crypto drift check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # backend/internal/xcrypto carries two golang.org/x/crypto packages
      # verbatim (see its README). Fails when the newest upstream release
      # differs from the copies, printing the diff.
      - name: Compare with the newest golang.org/x/crypto
        working-directory: backend
        run: ./internal/xcrypto/sync-upstream.sh --check latest

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Gate on high/critical with a documented exception list
      # (scripts/audit-gate.mjs). Plain `npm audit --audit-level=high` would
      # stay red forever on an advisory with NO patched release, which is how
      # real, fixable findings get ignored. Anything not listed there fails.
      - name: npm audit (high/critical, documented exceptions only)
        run: node scripts/audit-gate.mjs

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blocking for FIXABLE high/critical findings in lockfiles, IaC and
      # secrets; unfixed upstream advisories are still reported to the
      # Security tab via SARIF but do not turn unrelated pushes red.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          skip-dirs: node_modules,dist,test-results,playwright-report
      - name: Preserve scanner report independently of GitHub license
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.job }}-security-report
          path: trivy.sarif
          if-no-files-found: ignore
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ always() && (!github.event.repository.private || vars.ENABLE_PRIVATE_CODE_SCANNING == 'true') }}
        with:
          sarif_file: trivy.sarif
          category: trivy

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && !github.event.repository.private
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # Scorecard publishes signed results (publish_results: true)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        continue-on-error: true
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Preserve scanner report independently of GitHub license
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.job }}-security-report
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ always() && (!github.event.repository.private || vars.ENABLE_PRIVATE_CODE_SCANNING == 'true') }}
        with:
          sarif_file: results.sarif
          category: scorecard
