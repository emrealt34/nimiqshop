# ---------------------------------------------------------------------------
# nim.shop — Release
# Triggered by a version tag (v1.2.3). Builds everything and publishes a
# GitHub Release with:
#   · backend binaries  : linux / windows / macos × amd64 / arm64
#   · frontend dist     : deployable frontend zip (bundle + integrity.json)
#   · SHA256SUMS        : checksums for EVERY artifact above
# The backend binaries are built reproducibly (-trimpath -buildid=) so two
# independent builds from the same tag produce identical bytes — the hash
# you publish is the hash anyone can reproduce from source.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + rebuild bundle
        working-directory: frontend
        run: |
          npm ci
          node build.mjs

      - name: Regenerate integrity manifest
        run: node tools/integrity/generate.mjs all

      - name: Verify bundle + manifest match source
        run: git diff --exit-code -- frontend/js/bundle/ frontend/integrity.json backend/internal/integrity/source.integrity.json

      - name: Package deployable frontend (no node_modules)
        run: |
          cd frontend
          zip -r ../nimiqshop-frontend-dist.zip . -x 'node_modules/*' -x 'dev/*' -x '*.log'
          cd ..
          sha256sum nimiqshop-frontend-dist.zip > nimiqshop-frontend-dist.zip.sha256
          cat nimiqshop-frontend-dist.zip.sha256

      - name: Upload artifact for aggregate checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-frontend
          path: |
            nimiqshop-frontend-dist.zip
            nimiqshop-frontend-dist.zip.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nimiqshop-frontend-dist.zip

  backend:
    name: Backend (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: release-go-${{ hashFiles('backend/go.sum') }}

      - name: Regenerate embedded source manifest (deterministic)
        run: node tools/integrity/generate.mjs backend

      - name: Reproducible cross-compile
        working-directory: backend
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          mkdir -p ../release
          BIN="../release/nimiqshop-server-$GOOS-$GOARCH$EXT"
          CGO_ENABLED=0 go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-buildid=" \
            -o "$BIN" \
            ./cmd/server
          sha256sum "$BIN" > "$BIN.sha256"
          cat "$BIN.sha256"

      - name: Upload artifact for aggregate checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-backend-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/nimiqshop-server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}

  checksums:
    name: Aggregate SHA256SUMS
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined SHA256SUMS
        working-directory: artifacts
        run: |
          find . -type f \( -name 'nimiqshop-*' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Attach SHA256SUMS to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SHA256SUMS
