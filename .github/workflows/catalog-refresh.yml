name: Hourly catalog refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: catalog-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and persist catalog snapshots
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # persist generated JSON on the catalog-data branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      # No npm install/build/Cloudflare credentials needed to refresh data.
      - name: Restore previous catalog snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/catalog-data.mjs restore
      - name: Refresh catalog
        env:
          CATALOG_STOCK_STATE: scripts/data/stock-state.json
        run: node scripts/sync-catalog.mjs
      - name: Refresh market
        run: node scripts/sync-market.mjs
      - name: Publish refresh summary
        if: always()
        run: node scripts/catalog-refresh-summary.mjs
      - name: Persist refreshed snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/catalog-data.mjs persist

  deploy:
    needs: refresh
    permissions:
      contents: read
    # Kept compatible with the repository's actionlint version; reusable
    # workflow calls resolve this path at the caller's commit, not its checkout.
    uses: ./.github/workflows/cloudflare-pages.yml # zizmor: ignore[self-repository]
    with:
      skip_refresh: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
