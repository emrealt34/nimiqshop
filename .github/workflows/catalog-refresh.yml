name: Catalog and rates · every 6 hours

on:
  schedule:
    # UTC: 00:17, 06:17, 12:17, 18:17 (03:17, 09:17, 15:17, 21:17 in Turkey).
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Refresh trigger
        type: choice
        options: [manual, railway-watchdog]
        default: manual

permissions: {}

concurrency:
  group: catalog-refresh-main
  cancel-in-progress: false

jobs:
  freshness:
    name: Check whether catalog refresh is due
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout the freshness guard from main
      actions: read # inspect recent successful catalog snapshots and deployments
    outputs:
      due: ${{ steps.guard.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Avoid refreshing a recently published snapshot twice
        id: guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_SOURCE: ${{ inputs.source }}
        run: node scripts/catalog-refresh-due.mjs

  refresh:
    name: Refresh and persist catalog snapshots
    needs: freshness
    if: needs.freshness.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    outputs:
      complete: ${{ steps.result.outputs.complete }}
    permissions:
      contents: read
      actions: read # restore the previous main snapshot artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      # No npm install/build/Cloudflare credentials needed to refresh data.
      - name: Find previous catalog snapshot
        id: previous
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/catalog-data.mjs find
      - name: Download previous catalog snapshot
        if: steps.previous.outputs.run_id != '0'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-snapshots
          path: ${{ runner.temp }}/catalog-snapshot
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.previous.outputs.run_id }}
      - name: Restore previous catalog snapshots
        if: steps.previous.outputs.run_id != '0'
        run: node scripts/catalog-data.mjs restore
      - name: Refresh catalog
        id: catalog
        continue-on-error: true # retain good market updates during supplier outages
        env:
          CATALOG_STOCK_STATE: scripts/data/stock-state.json
          CATALOG_VERIFY_FULL: "1"
          CATALOG_VERIFY_BUDGET_MS: "10800000"
          CATALOG_VERIFY_INTERVAL_MS: "500"
        run: node scripts/sync-catalog.mjs
      - name: Refresh market
        id: market
        continue-on-error: true # persist good catalog data and keep prior failed rates
        run: node scripts/sync-market.mjs
      - name: Publish refresh summary
        if: always()
        env:
          REFRESH_SOURCE: ${{ inputs.source || github.event_name }}
          CATALOG_REFRESH_OUTCOME: ${{ steps.catalog.outcome }}
          MARKET_REFRESH_OUTCOME: ${{ steps.market.outcome }}
        run: node scripts/catalog-refresh-summary.mjs
      - name: Stage refreshed snapshots
        run: node scripts/catalog-data.mjs stage
      - name: Save catalog and market together
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-snapshots
          path: ${{ runner.temp }}/catalog-snapshot
          retention-days: 7
          compression-level: 9
          if-no-files-found: error

      # Keep the new data and deploy it, but never mark an incomplete scan successful.
      - name: Record complete scan result
        id: result
        env:
          CATALOG_REFRESH_OUTCOME: ${{ steps.catalog.outcome }}
          MARKET_REFRESH_OUTCOME: ${{ steps.market.outcome }}
        run: node scripts/catalog-refresh-result.mjs

  completeness:
    name: Confirm the full catalog scan completed
    needs: refresh
    if: always() && needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject an incomplete refresh
        env:
          COMPLETE: ${{ needs.refresh.outputs.complete }}
        run: |
          if [ "$COMPLETE" != "true" ]; then
            echo 'Full catalog incomplete. The partial snapshot is retained and deployed; see the refresh summary.'
            exit 1
          fi

  deploy:
    needs: refresh
    if: needs.refresh.result == 'success'
    permissions:
      contents: read
      actions: read # reusable deploy downloads this run's catalog-snapshots artifact
    # Kept compatible with the repository's actionlint version; reusable
    # workflow calls resolve this path at the caller's commit, not its checkout.
    uses: ./.github/workflows/cloudflare-pages.yml # zizmor: ignore[self-repository]
    with:
      skip_refresh: true
      snapshot_run_id: ${{ github.run_id }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
