name: OSSAR

# Open Source Static Analysis Runner (github/ossar-action). Windows-only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 8 * * 1"

concurrency:
  group: ossar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  OSSAR-Scan:
    name: OSSAR (Windows)
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      actions: read # codeql-action reads workflow metadata for the upload
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OSSAR
        uses: github/ossar-action@4e96c4f6e591eb4b991abfd459e40b136a317aea # v2.0.0
        id: ossar
      - name: Upload OSSAR results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.ossar.outputs.sarifFile }}
          category: ossar
