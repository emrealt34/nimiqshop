---
# Deploys the static frontend (dist/) to Cloudflare Pages on every push to
# main, so the live shop never depends on a hand-uploaded dist/ again.
#
# Setup (once, repository Settings → Secrets and variables → Actions):
#   secrets  CLOUDFLARE_API_TOKEN     API token with "Cloudflare Pages — Edit"
#            CLOUDFLARE_ACCOUNT_ID    the account that owns the Pages project
#   variable CLOUDFLARE_PAGES_PROJECT optional — the Pages project name; by
#            default the project that serves shop.nimiqbase.com is used
#
# Until the two secrets exist the workflow is a no-op that passes (the gate
# job says so in the summary), so a fork or a fresh clone is never red.
#
# Direct-upload deployments carry the commit hash and message, they are
# atomic on Cloudflare's side, and public/_headers keeps 404s under
# /_assets/* uncacheable so an early request during propagation can no
# longer pin a broken hash at the edge.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Hourly catalog refresh: sync-catalog.mjs pulls /v2/brands for every shop
  # country straight from CryptoRefills (partner-header auth, no secret) and
  # the build below bakes it into the static site, so the storefront's brand
  # grids never depend on the Go backend being alive. A failed sync keeps the
  # committed snapshot (continue-on-error) — a supplier wobble must neither
  # blank the shop nor stop a deploy.
  schedule:
    - cron: "17 * * * *"

permissions: {}

# Deploys queue; a deploy in flight is never cancelled half-way.
concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Cloudflare credentials present?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$CF_TOKEN" && -n "$CF_ACCOUNT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials found — deploying." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare Pages deploy skipped"
              echo
              echo "Add the repository secrets \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\`"
              echo "(and optionally the variable \`CLOUDFLARE_PAGES_PROJECT\`) to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Build · deploy dist/ to Cloudflare Pages
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: https://shop.nimiqbase.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: this job publishes what it builds, and a poisoned
      # cache entry must never be able to reach the live site (same rule as
      # release.yml).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci --no-audit --no-fund

      - name: Refresh the static catalog snapshot (CryptoRefills direct)
        continue-on-error: true
        run: node scripts/sync-catalog.mjs

      - name: Test same-origin API proxy
        run: npm run test:pages-proxy

      # Only /api/* executes a Pages Function; the rest stays static.
      # Prevent an inherited cross-origin build override in this deployment.
      - name: Build frontend
        run: npm run build
        env:
          PUBLIC_BASE: /
          PUBLIC_API_URL: /api
          API_URL: /api

      - name: Verify Pages routing artifact
        run: node scripts/check-pages-build.mjs

      # The project is found by the custom domain it serves, so nobody has to
      # know (or guess) the Pages project name; CLOUDFLARE_PAGES_PROJECT
      # overrides the lookup. Either way the name is checked against the
      # account's project list and a strict charset before it is used.
      - name: Resolve the Cloudflare Pages project
        id: project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIGURED: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SITE_HOST: shop.nimiqbase.com
        run: |
          set -euo pipefail
          # Secrets pasted from a dashboard often carry a stray newline or
          # blank; either one turns the URL into a 400.
          CF_ACCOUNT="${CF_ACCOUNT//[$'\r\n\t ']/}"
          CF_TOKEN="${CF_TOKEN//[$'\r\n\t ']/}"
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"
          status="$(curl -sS -o /tmp/projects.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Accept: application/json" "$api")"
          if [[ "$status" != 200 ]]; then
            detail="$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join("; ")' /tmp/projects.json 2>/dev/null || true)"
            echo "::error::Cloudflare API ${api##*/v4/} answered HTTP ${status} (${detail:-no error detail}). Check CLOUDFLARE_ACCOUNT_ID (32 hex characters) and that the API token has Account → Cloudflare Pages → Edit."
            exit 1
          fi
          projects="$(cat /tmp/projects.json)"
          existing="$(jq -r '[.result[].name] | join(", ")' <<<"$projects")"
          if [[ -n "$CONFIGURED" ]]; then
            name="$CONFIGURED"
          else
            name="$(jq -r --arg host "$SITE_HOST" \
              '[.result[] | select((.domains // []) | index($host))] | .[0].name // empty' <<<"$projects")"
          fi
          if [[ -z "$name" ]]; then
            echo "::error::No Cloudflare Pages project serves ${SITE_HOST} (projects in this account: ${existing:-none}). Set the repository variable CLOUDFLARE_PAGES_PROJECT."
            exit 1
          fi
          if ! jq -e --arg n "$name" '.result[] | select(.name == $n)' <<<"$projects" >/dev/null; then
            echo "::error::Pages project '${name}' does not exist in this account (projects: ${existing:-none})."
            exit 1
          fi
          [[ "$name" =~ ^[a-z0-9-]{1,58}$ ]] || { echo "::error::unexpected project name '${name}'"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Pages project: \`$name\` (serves ${SITE_HOST})" >> "$GITHUB_STEP_SUMMARY"

      # wrangler-action runs the command through @actions/exec (no shell), so
      # values are inlined as expressions: github.sha is a hex string and the
      # project name was validated by the step above.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ steps.project.outputs.name }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=false
