---
# Deploys the static frontend (dist/) to Cloudflare Pages on every push to
# main, so the live shop never depends on a hand-uploaded dist/ again.
#
# Setup (once, repository Settings → Secrets and variables → Actions):
#   secrets  CLOUDFLARE_API_TOKEN     API token with "Cloudflare Pages — Edit"
#            CLOUDFLARE_ACCOUNT_ID    the account that owns the Pages project
#   variable CLOUDFLARE_PAGES_PROJECT optional — the Pages project name; by
#            default the project that serves shop.nimiqbase.com is used
#
# Until the two secrets exist the workflow is a no-op that passes (the gate
# job says so in the summary), so a fork or a fresh clone is never red.
#
# Direct-upload deployments carry the commit hash and message, they are
# atomic on Cloudflare's side, and public/_headers keeps 404s under
# /_assets/* uncacheable so an early request during propagation can no
# longer pin a broken hash at the edge.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The saved workflow calls this with its exact saved data artifact.
  workflow_call:
    inputs:
      skip_refresh:
        description: Catalog was already refreshed by the caller
        type: boolean
        default: false
      snapshot_run_id:
        description: Main workflow run holding the catalog and market snapshot
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions: {}

# Deploys queue; a deploy in flight is never cancelled half-way.
concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Cloudflare credentials present?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$CF_TOKEN" && -n "$CF_ACCOUNT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials found — deploying." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare Pages deploy skipped"
              echo
              echo "Add the repository secrets \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\`"
              echo "(and optionally the variable \`CLOUDFLARE_PAGES_PROJECT\`) to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Build · deploy dist/ to Cloudflare Pages
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # download the exact saved catalog and market snapshot artifact
    environment:
      name: cloudflare-pages
      url: https://shop.nimiqbase.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Record deployed source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find saved catalog data
        if: inputs.snapshot_run_id == ''
        id: previous
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/catalog-data.mjs find

      - name: Download saved catalog data
        if: inputs.snapshot_run_id != '' || steps.previous.outputs.run_id != '0'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-snapshots
          path: ${{ runner.temp }}/catalog-snapshot
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.snapshot_run_id || steps.previous.outputs.run_id }}

      - name: Restore saved catalog data
        if: inputs.snapshot_run_id != '' || steps.previous.outputs.run_id != '0'
        run: node scripts/catalog-data.mjs restore

      # No dependency cache: this job publishes what it builds, and a poisoned
      # cache entry must never be able to reach the live site (same rule as
      # release.yml).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci --no-audit --no-fund

      # Catalog AND market prices in the same saved run: neither the brand
      # grids nor the NIM/BTC price may depend on the Go backend at page-load
      # time. Each script keeps the previous file when its sources fail, and
      # a fully-down supplier/backend must not stop the deploy. Code pushes
      # publish the restored saved snapshot; do not repeat a full stock
      # scan just to release an application fix.
      - name: Refresh static catalog snapshots
        if: github.event_name != 'push' && inputs.skip_refresh != true
        continue-on-error: true
        run: node scripts/sync-catalog.mjs

      - name: Refresh static market snapshots
        if: github.event_name != 'push' && inputs.skip_refresh != true
        continue-on-error: true
        run: node scripts/sync-market.mjs

      - name: Test same-origin API proxy
        run: npm run test:pages-proxy

      # Only /api/* executes a Pages Function; the rest stays static.
      # Prevent an inherited cross-origin build override in this deployment.
      - name: Build frontend
        run: npm run build
        env:
          PUBLIC_BASE: /
          PUBLIC_API_URL: /api
          API_URL: /api

      - name: Verify Pages routing artifact
        run: node scripts/check-pages-build.mjs

      # The project is found by the custom domain it serves, so nobody has to
      # know (or guess) the Pages project name; CLOUDFLARE_PAGES_PROJECT
      # overrides the lookup. Either way the name is checked against the
      # account's project list and a strict charset before it is used.
      - name: Resolve the Cloudflare Pages project
        id: project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIGURED: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SITE_HOST: shop.nimiqbase.com
        run: |
          set -euo pipefail
          # Secrets pasted from a dashboard often carry a stray newline or
          # blank; either one turns the URL into a 400.
          CF_ACCOUNT="${CF_ACCOUNT//[$'\r\n\t ']/}"
          CF_TOKEN="${CF_TOKEN//[$'\r\n\t ']/}"
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"
          status="$(curl -sS -o /tmp/projects.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Accept: application/json" "$api")"
          if [[ "$status" != 200 ]]; then
            detail="$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join("; ")' /tmp/projects.json 2>/dev/null || true)"
            echo "::error::Cloudflare API ${api##*/v4/} answered HTTP ${status} (${detail:-no error detail}). Check CLOUDFLARE_ACCOUNT_ID (32 hex characters) and that the API token has Account → Cloudflare Pages → Edit."
            exit 1
          fi
          projects="$(cat /tmp/projects.json)"
          existing="$(jq -r '[.result[].name] | join(", ")' <<<"$projects")"
          if [[ -n "$CONFIGURED" ]]; then
            name="$CONFIGURED"
          else
            name="$(jq -r --arg host "$SITE_HOST" \
              '[.result[] | select((.domains // []) | index($host))] | .[0].name // empty' <<<"$projects")"
          fi
          if [[ -z "$name" ]]; then
            echo "::error::No Cloudflare Pages project serves ${SITE_HOST} (projects in this account: ${existing:-none}). Set the repository variable CLOUDFLARE_PAGES_PROJECT."
            exit 1
          fi
          if ! jq -e --arg n "$name" '.result[] | select(.name == $n)' <<<"$projects" >/dev/null; then
            echo "::error::Pages project '${name}' does not exist in this account (projects: ${existing:-none})."
            exit 1
          fi
          [[ "$name" =~ ^[a-z0-9-]{1,58}$ ]] || { echo "::error::unexpected project name '${name}'"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Pages project: \`$name\` (serves ${SITE_HOST})" >> "$GITHUB_STEP_SUMMARY"

      # wrangler-action runs the command through @actions/exec (no shell), so
      # values are inlined as expressions: github.sha is a hex string and the
      # project name was validated by the step above.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ steps.project.outputs.name }}
            --branch=main
            --commit-hash=${{ steps.source.outputs.sha }}
            --commit-dirty=false

      # A DEPLOY IS NOT DONE WHEN WRANGLER RETURNS.
      #
      # On 2026-11-03 the live site was still serving the build of 6f50558
      # (`<meta name="shop-build">` in the HTML) three pushes after that — the
      # uploads reported success, the production alias never moved, and the
      # first-paint fix that had merged hours earlier was never seen by a
      # visitor. Nothing in the pipeline noticed, because the only thing it
      # checked was wrangler's exit code.
      #
      # So: read the marker the site stamps into every page (Base.astro writes
      # GITHUB_SHA into `meta[name=shop-build]`) and require it to BE this
      # commit within fifteen minutes. On 2026-11-09 the upload completed but
      # the runner still saw the previous build after five minutes; the correct
      # build later reached production. Allow for slower edge propagation but
      # still fail if the live alias never reaches this commit — an uploaded
      # preview or a stuck production deployment must not be reported as green.
      # EVERY page must come back with its own stylesheet, and that stylesheet
      # must be fetchable. A deploy that lands half-way (or an HTML cached from
      # an older build whose hashed CSS was pruned) shows up as a page with no
      # CSS at all — the exact complaint on 2026-11-03 ("sayfalar arası geçerken
      # yeni sayfada CSS yüklenmiyor"). Wrangler's exit code says nothing about
      # this, so check it here.
      - name: Verify every page can reach its stylesheet
        env:
          SITE: https://shop.nimiqbase.com
        run: |
          set -euo pipefail
          fail=0
          for path in / /cart/ /orders/ /track/ /cashback/ /quiz/ /support/ /status/ /activity/ /product/ /admin/; do
            html="$(curl -fsS --max-time 20 "${SITE}${path}?css-check=${RANDOM}" || true)"
            css="$(grep -o '/_assets/full\.[0-9a-f]*\.css' <<<"$html" | head -1 || true)"
            if [[ -z "$css" ]]; then
              echo "::error::${path} did not reference a deferred stylesheet at all"
              fail=1
              continue
            fi
            # Wrangler returning is NOT the same as the edge having the file.
            # On 2026-11-07 this check failed the deploy of 745f268 although the
            # deploy had landed: `/` was probed first and got 404 for
            # full.63d8b77c.css, while the ten pages probed after it got 200 for
            # the SAME url — which answers 200 ever since, from the alias that
            # serves exactly that commit. A brand-new hashed asset can 404 for
            # the few seconds Pages needs to propagate it, so ask again before
            # calling it missing. Six tries over ~50 s: long enough to outlast
            # propagation, short enough that a stylesheet which really was
            # pruned still turns the job red. The marker check below already
            # waits five minutes for the alias itself to move.
            code=""
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${SITE}${css}")"
              if [[ "$code" == "200" ]]; then break; fi
              if (( attempt < 6 )); then sleep 10; fi
            done
            inline="$(grep -c '<link id=\"late-css\"' <<<"$html" || true)"
            printf '%-13s %s → %s   (late-css link: %s)\n' "$path" "$css" "$code" "$inline"
            [[ "$code" == "200" ]] || { echo "::error::${path} references ${css}, which still answers ${code} after six tries over ~50 s"; fail=1; }
            [[ "$inline" != "0" ]] || { echo "::error::${path} has no <link id=\"late-css\"> — the deferred stylesheet can never apply"; fail=1; }
          done
          exit $fail

      - name: Verify the live site is serving THIS commit
        env:
          EXPECTED: ${{ steps.source.outputs.sha }}
          SITE: https://shop.nimiqbase.com/
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while :; do
            got="$(curl -fsS --max-time 20 "${SITE}?build-check=${RANDOM}" 2>/dev/null \
              | grep -o 'name="shop-build" content="[0-9a-f]*' | head -1 | sed 's/.*content="//' || true)"
            if [[ "$got" == "$EXPECTED" ]]; then
              echo "Live site is serving ${EXPECTED:0:8} — deployment confirmed." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if (( SECONDS > deadline )); then
              {
                echo "### Deployment did not reach production"
                echo
                echo "Wrangler uploaded \`${EXPECTED:0:8}\` but ${SITE} still answers \`${got:-nothing}\` after fifteen minutes."
                echo
                echo "Check 1 (project): Cloudflare dashboard → Workers & Pages → the Pages project →"
                echo "Settings → Build & deployments → *Production branch* must be \`main\`. When it is"
                echo "not, \`pages deploy --branch=main\` only creates a PREVIEW deployment and the"
                echo "production alias keeps serving an older build."
                echo "Check 2 (deployment): Deployments list — is the newest production deployment"
                echo "the commit above, or is it stuck in *queued*/*failed*? Retry it, or promote it"
                echo "from the dashboard."
                echo "Check 3 (cache): \`curl -sI ${SITE} | grep -i cf-cache-status\` — DYNAMIC is"
                echo "uncached (expected); anything else means a cache rule is pinning the HTML."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Production still serves '${got:-nothing}', not ${EXPECTED}. See the job summary."
              exit 1
            fi
            sleep 15
          done
