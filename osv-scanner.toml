# OSV-Scanner configuration for the manifests in THIS directory (the repo root),
# which today means package-lock.json.
#
# An entry here is a documented exception, not a mute button: it must name a
# real reason and an expiry date, after which the scanner reports the finding
# again and the exception has to be re-justified (or removed, because upstream
# patched it).
#
# Four rules worth stating explicitly, because all four have already been got
# wrong in this repo:
#
#   1. THIS FILE ONLY COVERS THE ROOT DIRECTORY. osv-scanner loads a config from
#      the directory of each scanned manifest and does not propagate it to child
#      directories, so nothing here applies to .github/semgrep-requirements.txt
#      or to backend/go.mod. Those directories carry their own osv-scanner.toml
#      (.github/osv-scanner.toml exists today). Putting an exception here for a
#      finding that lives in a subdirectory does nothing at all — the entry is
#      reported as unused and the finding stays in the output.
#   2. `exit code 1` from the scan step means a REAL FINDING. "has unused
#      ignores" is only a warning: the 2026-10-11 job logged that line and still
#      exited 0, and osv-scanner's documented return codes agree (0 = no
#      vulnerabilities, 1 = vulnerabilities or findings). Do not chase the
#      warning when the job is red.
#   3. The finding itself is NOT echoed in the job log, because the step runs
#      with `--format=sarif --output=osv-results.sarif` and writes results to a
#      file. Download the `osv-security-report` artifact before concluding
#      anything from the log alone — it also names the manifest, which is what
#      tells you which directory's config has to carry the exception.
#   4. `id` is compared against the ID the scanner reports, and an ignore also
#      covers that vulnerability's aliases. Verified locally with the v2.6.0
#      binary: naming either CVE-2026-59951 or its GHSA-84m7-p3x7-pcfv alias
#      filtered the very same finding, exit 0 both ways. So ONE entry is enough —
#      listing both makes the second show up as an unused ignore, because the
#      first match consumes the finding. Prefer the ID exactly as it appears in
#      the SARIF output.
#
# See also scripts/audit-gate.mjs, which keeps the equivalent exception list for
# `npm audit`. Those two lists have to agree about *npm* advisories — which are
# exactly the ones this root file can act on. They are not mirrors of each other:
# exceptions for other ecosystems belong next to their own manifest and have no
# counterpart in the npm gate.
#
# No exceptions are currently outstanding for the root manifests.

# Retired 2026-10-17 — GHSA-ch52-4w7c-c8xp (CVE-2026-93748, http-cache-semantics
# <= 4.2.0, max-stale cross-user cache disclosure). Added on 2026-10-03 when
# npm's latest was 4.2.0 and the advisory declared no patched release.
# package-lock.json has carried 4.3.0 since 2026-10-06 and OSV's range for the
# advisory ends at last_affected 4.2.0, so nothing in the tree matches it any
# more and the ignore went unused. Removed here and, to keep the npm gates in
# agreement, from ALLOWED in scripts/audit-gate.mjs. `npm audit` now reports zero
# advisories across the whole tree. Do not re-add it unless a version below
# 4.3.0 returns to the lockfile.

# Template for a new exception (put it in the directory of the manifest that
# triggers it, not necessarily here):
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"   # exactly as osv-scanner reports it in the SARIF
# ignoreUntil = YYYY-MM-DD
# reason = """
# What the vulnerability is, which manifest pulls the package in, why it cannot
# be fixed by upgrading yet, why it is not reachable in the shipped artifact, and
# what event should retire this entry.
# """
